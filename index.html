<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VolleyFit</title>
<meta name="description" content="Catalogo di esercizi di pallavolo e di preparazione fisica, con animazioni, passi, punti di attenzione e correzioni.">
<meta name="theme-color" content="#1546A0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone/icona.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone/icona-180.png">
<style>
@font-face{font-family:Sora;font-weight:400;font-display:swap;src:url(fonts/sora-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:600;font-display:swap;src:url(fonts/sora-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Sora;font-weight:700;font-display:swap;src:url(fonts/sora-latin-700-normal.woff2) format('woff2')}
:root{
  color-scheme:light;
  --bg:#F2F1EE; --surface:#FFFFFF; --surface-2:#F7F6F3; --sunken:#E9E7E2;
  --ink:#1A1C1E; --ink-2:#454A52; --muted:#636872; --line:#E1DED8; --line-2:#D0CCC4;
  --accent:#1546A0; --accent-ink:#0E3378; --accent-soft:#E6EEF9; --on-accent:#FFFFFF;
  --ball:#F6B93B; --court:#1546A0; --floor:#E8833A;
  --muscle:#E2553A; --muscle-far:#EFA08F; --muscle-soft:#FBE3DC; --muscle-ink:#8E2A17; --muscle-soft-fill:#F3B9A9;
  --body:#D9D6D0;
  --ok:#1C7342; --ok-soft:#E3F2E8; --bad:#9A2B1A; --bad-soft:#FBEBE7; --warn-soft:#FFF4D6; --warn-ink:#6B4F00;
  --anim-bg:#EAF0F8; --anim-ink:#1A1C1E; --anim-far:#9CA2AB; --anim-ground:#BFC8D6; --band:#1F6FD1; --mat:#C9C5BD; --prop:#8B95A5;
  --shadow:0 1px 2px rgba(26,28,30,.06), 0 4px 14px rgba(26,28,30,.06);
  --r:16px; --font:Sora, system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-tema="chiaro"]){
  color-scheme:dark;
  --bg:#111316; --surface:#1A1D22; --surface-2:#20242A; --sunken:#0C0E10;
  --ink:#E9EBEE; --ink-2:#BCC2CB; --muted:#949CA8; --line:#2B3038; --line-2:#3A414B;
  --accent:#7EA6F2; --accent-ink:#C7D8FA; --accent-soft:rgba(126,166,242,.15); --on-accent:#0B1424;
  --court:#163D85; --floor:#D57434;
  --muscle:#F07A5F; --muscle-far:#9B5446; --muscle-soft:rgba(240,122,95,.16); --muscle-ink:#F6B3A3; --muscle-soft-fill:#7A4235;
  --body:#3A3F47;
  --ok:#6FD39A; --ok-soft:rgba(60,170,110,.15); --bad:#F5A99A; --bad-soft:rgba(220,80,60,.15); --warn-soft:rgba(240,200,80,.13); --warn-ink:#F0D27A;
  --anim-bg:#1E252F; --anim-ink:#E9EBEE; --anim-far:#68707C; --anim-ground:#3B4553; --band:#62A2F5; --mat:#4A4F57; --prop:#7A8494;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-tema="scuro"]{
  color-scheme:dark;
  --bg:#111316; --surface:#1A1D22; --surface-2:#20242A; --sunken:#0C0E10;
  --ink:#E9EBEE; --ink-2:#BCC2CB; --muted:#949CA8; --line:#2B3038; --line-2:#3A414B;
  --accent:#7EA6F2; --accent-ink:#C7D8FA; --accent-soft:rgba(126,166,242,.15); --on-accent:#0B1424;
  --court:#163D85; --floor:#D57434;
  --muscle:#F07A5F; --muscle-far:#9B5446; --muscle-soft:rgba(240,122,95,.16); --muscle-ink:#F6B3A3; --muscle-soft-fill:#7A4235;
  --body:#3A3F47;
  --ok:#6FD39A; --ok-soft:rgba(60,170,110,.15); --bad:#F5A99A; --bad-soft:rgba(220,80,60,.15); --warn-soft:rgba(240,200,80,.13); --warn-ink:#F0D27A;
  --anim-bg:#1E252F; --anim-ink:#E9EBEE; --anim-far:#68707C; --anim-ground:#3B4553; --band:#62A2F5; --mat:#4A4F57; --prop:#7A8494;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
[hidden]{display:none!important}

/* ---------- testata */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .in{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;text-decoration:none;color:var(--ink);flex:none}
.brand .dot{width:28px;height:28px;border-radius:50%;background:var(--ball);display:grid;place-items:center;color:#1A1C1E;flex:none}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:-2px}
.topnav{display:flex;gap:4px;margin-left:8px}
.topnav a{padding:9px 14px;border-radius:10px;text-decoration:none;color:var(--ink-2);font-weight:600;font-size:14px}
.topnav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink)}
.topsearch{flex:1 1 260px;max-width:440px;margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:44px}
.topsearch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15px}
.syncpill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer;flex:none}
.syncpill i{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.syncpill.ok i{background:var(--ok)} .syncpill.pending i,.syncpill.busy i{background:var(--ball)} .syncpill.err i{background:var(--bad)} .syncpill.offline i{background:var(--muted)}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.plain{border-color:transparent;background:transparent}
.only-phone{display:none}
@media (max-width: 899px){
  .topnav,.topsearch.wide,.only-wide{display:none!important}
  .only-phone{display:inline-flex}
  .brand small{display:none}
  body{padding-bottom:calc(78px + env(safe-area-inset-bottom))}
}
.bnav{display:none}
@media (max-width: 899px){
  .bnav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:11.5px;font-weight:600}
  .bnav a[aria-current="page"]{color:var(--accent)}
  .bnav a.nuovo span.b{width:46px;height:34px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
}

/* ---------- impaginazione */
main{max-width:1280px;margin:0 auto;padding:16px 16px 40px}
main:focus{outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:14.5px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary:hover{opacity:.92}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:default}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:12px}
.panel h2,.ptitle{font-size:12.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
@media (max-width:600px){ .h1{font-size:22px} }
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.soft{border:0;background:var(--accent-soft);color:var(--accent-ink);cursor:default}
.chip.musc{border:0;background:var(--muscle-soft);color:var(--muscle-ink);cursor:default}
.chip.musc.on{background:var(--muscle);color:#fff}
.chip.x{padding-right:6px}
.chip.x b{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,currentColor 15%,transparent);font-weight:700}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--sunken);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--ink-2);font-weight:600;font-size:14px;cursor:pointer;padding:0 6px;line-height:1.2}
@media (max-width:420px){ .seg button{font-size:13px;padding:0 3px} }
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--accent)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.banner{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-soft);color:var(--warn-ink);display:flex;gap:10px;align-items:flex-start}
.banner.info{background:var(--accent-soft);color:var(--accent-ink)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
.inp,label.f input,label.f select,label.f textarea{min-height:44px;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 12px;font-size:15px;font-weight:400;color:var(--ink);width:100%}
label.f textarea{resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:600px){ .grid3{grid-template-columns:repeat(2,minmax(0,1fr))} }

/* ---------- catalogo */
.cat{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width: 1000px){ .cat{grid-template-columns:350px minmax(0,1fr);align-items:start} .cat aside{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;padding-bottom:8px} }
.cat-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.cat-head .h1{flex:1 1 auto}
.pks{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:thin}
@media (min-width:1000px){ .pks{flex-direction:column;overflow:visible} }
.pk{flex:none;width:150px;text-align:left;border:0;border-radius:14px;padding:10px 12px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.pk:before{content:"";position:absolute;left:0;top:0;bottom:0;width:0}
.pk small{font-size:11.5px;color:var(--muted)}
.pk b{font-size:14px;line-height:1.25}
.pk .sw{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:6px;vertical-align:-1px}
.pk[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.pk[aria-pressed="true"] small{color:inherit;opacity:.85}
@media (min-width:1000px){ .pk{width:auto;flex-direction:row;align-items:center;gap:10px} .pk b{flex:1} }
.mappa{background:var(--surface);border-radius:var(--r);padding:12px;box-shadow:var(--shadow)}
.corpo-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-items:end}
.corpo-map figure{margin:0;text-align:center}
.corpo-map svg{width:100%;max-height:250px;height:auto;display:block}
.corpo-map figcaption{font-size:12px;color:var(--muted);font-weight:600}
.zona.clic{cursor:pointer;transition:fill .15s}
.zona.clic:hover{filter:brightness(.92)}
.zona.clic:focus{outline:none}
.zona.clic:focus-visible{stroke:var(--accent);stroke-width:3}
.campo-map{position:relative;border-radius:14px;overflow:hidden;background:var(--court);aspect-ratio:1.25}
.campo-map svg{position:absolute;inset:0;width:100%;height:100%}
.campo-map .fb{position:absolute;transform:translate(-50%,-50%);min-height:40px;padding:0 14px;border-radius:999px;border:0;background:#fff;color:#1A1C1E;font-weight:600;font-size:13.5px;box-shadow:0 2px 6px rgba(0,0,0,.25);cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.campo-map .fb small{font-weight:400;color:#555}
.campo-map .fb[aria-pressed="true"]{background:#1A1C1E;color:#fff;box-shadow:0 0 0 4px var(--ball)}
.campo-map .fb[aria-pressed="true"] small{color:#ddd}
.filtri-att{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0 12px}
.risultati{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
@media (max-width:599px){ .risultati{grid-template-columns:minmax(0,1fr);gap:8px} }
.ce{position:relative;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.ce .th{background:var(--anim-bg);aspect-ratio:1.6;display:grid;place-items:center;overflow:hidden}
.ce .th svg{width:100%;height:100%;display:block}
.ce .th.campo{background:var(--court)}
.ce .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.ce .amb{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.ce .amb.fis{color:var(--muscle-ink)}
.ce h3{font-size:15.5px;font-weight:600;line-height:1.3}
.ce h3 a{color:inherit;text-decoration:none}
.ce h3 a:after{content:"";position:absolute;inset:0}
.ce .mt{font-size:13px;color:var(--muted);display:flex;gap:4px 8px;flex-wrap:wrap;align-items:center;margin-top:auto;white-space:nowrap}
.ce .star{position:absolute;top:6px;right:6px;z-index:2;width:40px;height:40px;border-radius:50%;border:0;background:color-mix(in srgb,var(--surface) 85%,transparent);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.ce .star[aria-pressed="true"]{color:#C98A00}
.ce .star[aria-pressed="true"] svg{fill:#F6B93B}
.ce .tag{position:absolute;top:8px;left:8px;z-index:1;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface);color:var(--ink-2)}
@media (max-width:599px){
  .ce{flex-direction:row;align-items:stretch}
  .ce .th{width:112px;aspect-ratio:auto;flex:none;min-height:92px}
  .ce .star{top:50%;transform:translateY(-50%);right:4px}
  .ce .bd{padding-right:48px}
  .ce .tag{display:none}
}

/* ---------- scheda dell'esercizio */
.sch-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 16px;margin-bottom:14px}
.sch-head .tt{flex:999 1 380px;min-width:0}
.crumb{font-size:13px;color:var(--muted);font-weight:600;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sch{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.sch .main{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:14px}
.sch .side{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.player{background:var(--surface);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.stage{background:var(--anim-bg);position:relative}
.stage.campo{background:var(--court)}
.stage svg{display:block;width:100%;height:auto;max-height:62vh}
.stage .badge{position:absolute;left:10px;top:10px;font-size:12px;font-weight:600;background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;box-shadow:var(--shadow)}
.stage:fullscreen{display:grid;place-items:center;background:var(--anim-bg)}
.stage.campo:fullscreen{background:var(--court)}
.stage:fullscreen svg{max-height:100vh;width:auto;max-width:100vw}
.ctrl{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.ctrl .play{width:46px;height:46px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.prog{flex:1 1 120px;height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent)}
.passi{display:flex;flex-direction:column;gap:2px}
.passo{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:0;border-radius:12px;padding:10px;background:transparent;cursor:pointer}
.passo .n{width:28px;height:28px;border-radius:50%;background:var(--line-2);color:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;transition:background .2s}
.passo b{display:block;font-size:15px}
.passo span.tx{display:block;color:var(--ink-2);font-size:14px;line-height:1.45}
.passo[aria-current="step"]{background:var(--accent-soft)}
.passo[aria-current="step"] .n{background:var(--accent);color:var(--on-accent)}
.lavora{display:flex;gap:12px;align-items:center}
.lavora .big{width:52px;height:52px;border-radius:14px;background:var(--court);color:#fff;display:grid;place-items:center;flex:none}
.lavora .big.fis{background:var(--muscle)}
.minisag{display:flex;gap:2px;flex:none}
.minisag svg{width:58px;height:auto}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.info div{background:var(--surface-2);border-radius:12px;padding:8px 10px;min-width:0}
.info small{display:block;font-size:11.5px;color:var(--muted)}
.info b{font-size:14.5px;overflow-wrap:anywhere}
ul.att{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.att li{display:flex;gap:8px;font-size:14.5px;line-height:1.45}
ul.att li svg{flex:none;color:var(--ok);margin-top:2px}
.err{border-radius:12px;background:var(--bad-soft);padding:10px 12px;font-size:14.5px;line-height:1.45}
.err b{color:var(--bad)}
.err + .err{margin-top:8px}
.err .co{display:flex;gap:6px;margin-top:4px}
.err .co svg{flex:none;color:var(--ok);margin-top:3px}
.var{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (max-width:480px){ .var{grid-template-columns:minmax(0,1fr)} }
.var div{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14px}
.var small{display:block;font-weight:600;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.azioni{display:flex;gap:8px;flex-wrap:wrap}
.navsch{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:18px}
.stampa-passi{display:none}

/* ---------- editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:1000px){ .ed{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start} .ed .full{grid-column:1/-1} }
.ed-stage{background:var(--anim-bg);border-radius:14px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.ed-stage.campo{background:var(--court)}
.ed-stage svg{display:block;width:100%;height:auto}
.ed-stage [data-el]{cursor:grab}
.frames{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.frame{flex:none;width:96px;border-radius:12px;border:2px solid var(--line);background:var(--surface);padding:4px;cursor:pointer;text-align:center;font-size:12px;font-weight:600;color:var(--ink-2)}
.frame svg{width:100%;height:auto;display:block;border-radius:8px;margin-bottom:3px}
.frame[aria-pressed="true"]{border-color:var(--accent);color:var(--ink)}
.frame.add{display:grid;place-items:center;border-style:dashed;min-height:80px;color:var(--accent)}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-weight:600;font-size:13.5px}
.tool[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.slider{display:grid;grid-template-columns:120px minmax(0,1fr) 44px;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.slider input{width:100%}
.slider output{text-align:right;font-variant-numeric:tabular-nums}
.listed{display:flex;flex-direction:column;gap:8px}
.li-ed{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;background:var(--surface-2);border-radius:12px;padding:10px}
.li-ed .ops{display:flex;flex-direction:column;gap:4px}
.li-ed .ops .icon-btn{width:36px;height:36px;border-radius:9px}
.savebar{position:sticky;bottom:0;z-index:20;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:12px 0 calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent)}
@media (max-width:899px){ .savebar{bottom:calc(64px + env(safe-area-inset-bottom))} }
.savebar .msg{margin-right:auto;font-size:13.5px;color:var(--muted)}

/* ---------- pacchetti */
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pk-card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:8px;position:relative;text-decoration:none;color:inherit}
.pk-card .bar{height:6px;border-radius:3px;margin:-4px 0 4px}
.pk-card h3{font-size:17px}
.pk-card p{margin:0;color:var(--ink-2);font-size:14px}
.pk-card .n{font-size:13px;color:var(--muted);margin-top:auto}

/* ---------- finestre */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,12,16,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--surface);border-radius:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .mh{display:flex;align-items:center;gap:10px;padding:14px 14px 6px 18px;position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mh h2{flex:1;font-size:18px}
.modal .mb{padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px}
.modal .mf{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px calc(16px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line)}
@media (max-width:599px){ .modal{align-items:flex-end;padding:0} .modal .box{border-radius:20px 20px 0 0;max-height:92vh} }
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:14px;padding:12px 14px;cursor:pointer}
.choice:hover{background:var(--surface-2)}
.choice b{display:block}
.choice span{font-size:13.5px;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px)}
@media (min-width:900px){ .toast{bottom:24px} }
.aggiorna{position:fixed;left:16px;right:16px;bottom:calc(90px + env(safe-area-inset-bottom));z-index:70;max-width:520px;margin:0 auto;background:var(--accent);color:var(--on-accent);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.aggiorna .btn{background:var(--surface);color:var(--ink);border:0}
.guida h3{font-size:16px;margin:14px 0 6px}
.guida p,.guida li{font-size:14.5px;color:var(--ink-2)}
.guida code{font-size:13px;background:var(--surface-2);padding:1px 6px;border-radius:6px}

@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

/* ---------- stampa */
@media print{
  @page{margin:14mm}
  body{background:#fff;color:#000;padding:0}
  .top,.bnav,.ctrl,.azioni,.navsch,.savebar,.toast,.aggiorna,.noprint,.player{display:none!important}
  main{padding:0;max-width:none}
  .panel{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .sch{display:block}
  .sch .side{margin-top:12px}
  .stampa-passi{display:grid!important;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
  .stampa-passi figure{margin:0;border:1px solid #ccc;border-radius:8px;overflow:hidden;break-inside:avoid}
  .stampa-passi svg{width:100%;height:auto;display:block}
  .stampa-passi figcaption{font-size:11px;padding:4px 6px}
}
</style>
</head>
